<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HLS Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
  <style>
    body { background-color: #0b0c10; }
    .bg-dark-card { background-color: #1f2833; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0c10; }
    ::-webkit-scrollbar-thumb { background: #1f2833; border-radius: 3px; }
    
    .prose {
      color: #e5e7eb !important;
      font-size: 15px !important;
      line-height: 1.8 !important;
      max-width: none !important;
    }
    .prose p { margin-top: 0.8em; margin-bottom: 0.8em; }
    .prose strong { color: #ffffff; font-weight: 600; }
    .prose em { color: #d1d5db; font-style: italic; }
    
    .prose h1 { font-size: 1.6em; font-weight: 700; color: #fff; margin-top: 1.5em; margin-bottom: 0.5em; padding-bottom: 0.3em; border-bottom: 1px solid #374151; }
    .prose h2 { font-size: 1.4em; font-weight: 700; color: #fff; margin-top: 1.5em; margin-bottom: 0.5em; }
    .prose h3 { font-size: 1.2em; font-weight: 600; color: #e5e7eb; margin-top: 1.2em; margin-bottom: 0.4em; }
    
    .prose pre { 
      background-color: #0d1117 !important; 
      border: 1px solid #30363d !important;
      padding: 1.25rem !important; 
      border-radius: 0.75rem !important; 
      margin: 1.25rem 0 !important; 
      overflow-x: auto;
      position: relative;
    }
    .prose pre code { 
      color: #e5e7eb !important; 
      font-size: 14px !important;
      line-height: 1.7 !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace !important;
      background: none !important;
      padding: 0 !important;
    }
    
    .prose :not(pre) > code { 
      background-color: rgba(88, 101, 242, 0.15) !important; 
      color: #c7d2fe !important; 
      padding: 0.15em 0.45em !important; 
      border-radius: 0.35rem !important; 
      font-size: 0.9em !important; 
      font-weight: 500 !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace !important;
    }
    
    .copy-btn {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background-color: #161b22;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 0.35rem 0.7rem;
      border-radius: 0.5rem;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      opacity: 0;
      z-index: 10;
    }
    .prose pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background-color: #5865F2; color: #ffffff; }
    .copy-btn.copied { background-color: #10B981; color: white; border-color: #10B981; opacity: 1; }

    .streaming-cursor {
      display: inline-block;
      width: 6px;
      height: 1.1em;
      background-color: #7c82ff;
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blink 0.9s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .logo-style {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 1.5rem;
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.25);
      margin: 0 auto;
    }
    
    :root {
      color-scheme: dark;
      --hls-bg: #0d0d0f;
      --hls-panel: #141416;
      --hls-hover: #202024;
      --hls-line: rgba(255, 255, 255, 0.08);
      --hls-line-strong: rgba(255, 255, 255, 0.14);
      --hls-text: #f3f4f6;
      --hls-accent: #7c82ff;
    }

    body {
      background: var(--hls-bg);
      color: var(--hls-text);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #sidebar {
      width: 272px;
      background: #121214 !important;
      border-color: var(--hls-line) !important;
    }

    .user-tier-badge {
      font-size: 10px !important;
      font-weight: 700 !important;
      letter-spacing: .11em !important;
    }

    .new-chat-button {
      border: 1px solid var(--hls-line) !important;
      border-radius: 12px !important;
      padding: 10px 12px !important;
    }
    .new-chat-button:hover { background: var(--hls-hover) !important; }

    .assistant-card {
      width: 100%;
      padding: 4px 2px 20px !important;
      color: #e7e7eb !important;
      background: transparent !important;
    }
    .assistant-label {
      color: #b9bbc5 !important;
      font-size: 11px !important;
      font-weight: 750 !important;
      letter-spacing: .12em !important;
    }
    .assistant-label::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--hls-accent);
      box-shadow: 0 0 14px rgba(124, 130, 255, .8);
    }
    .user-card {
      max-width: min(85%, 680px) !important;
      padding: 11px 16px !important;
      color: #f2f2f4 !important;
      background: #202023 !important;
      border: 1px solid rgba(255,255,255,.055) !important;
      border-radius: 20px !important;
    }

    .thought-toggle {
      margin: 4px 0 10px !important;
      padding: 6px 10px !important;
      color: #a7a7af !important;
      background: #18181b !important;
      border: 1px solid var(--hls-line) !important;
      border-radius: 8px !important;
      font-size: 11px !important;
    }
    .thought-area {
      margin-bottom: 14px !important;
      padding: 10px 12px !important;
      color: #999aa3 !important;
      background: #151518 !important;
      border: 1px solid var(--hls-line) !important;
      border-left: 2px solid #555a9b !important;
      border-radius: 8px !important;
      line-height: 1.6;
      font-size: 12px !important;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #8f94ff;
      animation: status-pulse 1.8s ease-out infinite;
    }
    @keyframes status-pulse {
      0% { box-shadow: 0 0 0 0 rgba(143, 148, 255, .42); opacity: .72; }
      60% { box-shadow: 0 0 0 6px rgba(143, 148, 255, 0); opacity: 1; }
      100% { box-shadow: 0 0 0 0 rgba(143, 148, 255, 0); opacity: .72; }
    }
    .response-preparing {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 3px 18px;
      color: #8f9099;
      font-size: 12px;
    }

    #chat-form {
      background: #1b1b1e !important;
      border: 1px solid var(--hls-line-strong) !important;
      border-radius: 22px !important;
    }
    #user-input {
      min-height: 52px;
      max-height: 180px;
      color: #f5f5f6 !important;
    }
    #send-btn {
      width: 36px;
      height: 36px;
      background: #f0f0f2 !important;
      color: #101014 !important;
      border-radius: 50% !important;
    }
    #send-btn.generating { background: #343438 !important; color: #fff !important; }
    #send-btn .stop-icon { display: none; }
    #send-btn.generating .send-icon { display: none; }
    #send-btn.generating .stop-icon { display: block; }
  </style>
</head>
<body class="text-gray-200 h-[100dvh] flex flex-col md:flex-row font-sans overflow-hidden">

  <!-- 인증 오버레이 -->
  <div id="auth-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white text-slate-900 rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
      <div class="flex border-b border-slate-100 bg-slate-50 p-1.5">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-3 text-center text-sm font-semibold rounded-xl transition-all text-blue-600 bg-white shadow-sm">기존 키로 로그인</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-3 text-center text-sm font-semibold rounded-xl transition-all text-slate-500 hover:text-slate-800">무료 엑세스 키 신청</button>
      </div>
      <div class="p-6 sm:p-8">
        <div id="panelLogin" class="space-y-5">
          <div class="space-y-1"><h1 class="text-xl font-bold tracking-tight">HLS Service 인증</h1><p class="text-xs text-slate-500">발급받으신 고유 액세스 키(X-Access-Key)를 입력해 주세요.</p></div>
          <div class="space-y-3">
            <div class="space-y-1.5"><label class="text-xs font-semibold text-slate-600 tracking-wide">ACCESS KEY</label><div class="relative"><input type="password" id="accessKeyInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-mono transition-all placeholder:font-sans" placeholder="HLS-KEY-XXXXXX"><button type="button" onclick="toggleKeyVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs font-medium px-2 py-1">보기</button></div></div>
            <label class="flex items-center space-x-2 cursor-pointer select-none"><input type="checkbox" id="rememberKey" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500/20" checked><span class="text-xs font-medium text-slate-600">이 기기에 키 저장하고 자동 로그인</span></label>
            <button id="auth-submit-btn" onclick="submitAccessKey()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl text-sm shadow-sm transition-all">인증 후 입장하기</button>
            <p id="auth-error" class="text-red-500 text-sm hidden" aria-live="polite"></p>
          </div>
        </div>
        <div id="panelRegister" class="space-y-5 hidden">
          <div class="space-y-1"><h1 class="text-xl font-bold tracking-tight">Access Key Request</h1><p class="text-xs text-slate-500">현재 가입 신청 및 발급이 가능합니다.</p></div>
          <div class="space-y-4">
            <div class="space-y-1.5"><label class="text-xs font-semibold text-slate-600 tracking-wide">연락처 (이메일)</label><input type="text" id="regContact" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none" placeholder="example@email.com"></div>
            <button id="register-submit-btn" onclick="requestNewAccessKey()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl text-sm transition-all">액세스 키 신청하기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 사이드바 -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-950 border-r border-gray-900 flex flex-col shrink-0 h-full z-30 transform -translate-x-full transition-transform duration-300 md:relative md:transform-none">
    <div class="p-4 border-b border-gray-900 flex flex-col gap-2">
      <div class="font-extrabold text-xl tracking-wider text-white px-2 py-1 flex items-center justify-between">
        <span class="inline-flex items-baseline gap-2"><span>HLS</span><span id="user-tier-badge-pc" class="user-tier-badge text-blue-400">FREE</span></span>
        <button onclick="toggleSidebar(false)" class="md:hidden text-gray-400 hover:text-white">✕</button>
      </div>
      <button onclick="startNewChat(); toggleSidebar(false);" class="new-chat-button w-full bg-transparent hover:bg-gray-800 text-white rounded-lg text-sm font-medium p-2.5 transition flex items-center justify-center gap-2 mt-1">
        + 새 채팅 시작하기
      </button>
    </div>
    <div class="p-2 text-xs font-bold text-gray-500 uppercase tracking-wider px-4 pt-4">최근 대화방</div>
    <div id="room-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
  </aside>

  <!-- 메인 영역 -->
  <div class="flex-1 flex flex-col min-w-0 h-full justify-between overflow-hidden">
    <header class="border-b border-gray-900 bg-[#0d0d0f] px-4 md:px-6 py-3.5 flex justify-between items-center shrink-0">
      <div class="flex items-center space-x-3 min-w-0">
        <button onclick="toggleSidebar(true)" class="md:hidden text-gray-400 hover:text-white p-1">☰</button>
        <span id="current-room-title" class="font-bold text-sm text-gray-400 truncate">새로운 대화 세션</span>
      </div>
      <div class="text-xs font-bold text-gray-400 bg-gray-900 border border-gray-800 px-2.5 py-1 rounded-lg">HLS Service</div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 max-w-4xl w-full mx-auto space-y-6">
      <div id="welcome-message" class="text-center py-12 md:py-16 space-y-5">
        <div class="flex justify-center">
          <img src="https://github.com/FLY-H4N33/FLY-H4N-HLS/blob/main/HLS_ICON.png?raw=true" alt="HLS Logo" class="logo-style">
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-white">무엇을 도와드릴까요?</h1>
        <p class="text-gray-400 max-w-md mx-auto text-xs md:text-sm px-4">HLS 고성능 추론 인공지능</p>
      </div>
    </main>

    <footer class="p-4 pb-6 md:p-4 bg-[#0d0d0f] shrink-0">
      <div class="max-w-4xl w-full mx-auto relative space-y-3">
        <div id="continue-banner" class="hidden flex items-center justify-between bg-yellow-950 border border-yellow-800 rounded-xl p-3 text-xs text-yellow-200">
          <span>⚠️ 출력이 중간에 유실되었습니다. 이어서 받으시겠습니까?</span>
          <button onclick="triggerContinueResponse()" class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-3 py-1.5 rounded-lg">이어서 받기</button>
        </div>

        <div class="flex items-center space-x-3 bg-transparent px-2">
          <select id="model-selector" onchange="updateModelDescription()" class="bg-gray-900 border border-gray-700 rounded-lg text-white text-xs p-1.5 focus:outline-none">
            <option value="light">Light HLS</option>
            <option value="pro" selected>HLS PRO</option>
            <option value="ultra">HLS PRO-ULTRA</option>
          </select>
          <span id="model-description" class="text-[11px] text-gray-500 truncate">불러오는 중...</span>
        </div>

        <form id="chat-form" onsubmit="handleSubmit(event)" class="relative p-2 flex flex-col focus-within:border-indigo-500 transition">
          <textarea id="user-input" rows="3" placeholder="메시지를 입력하세요..." class="w-full bg-transparent resize-none focus:outline-none p-2 text-white placeholder-gray-500 text-sm"></textarea>
          <div class="flex justify-between items-center pt-2 px-2 border-t border-gray-800">
            <span id="char-counter" class="text-xs text-gray-500">0 / -</span>
            <button type="submit" id="send-btn" class="flex items-center justify-center">
              <svg class="send-icon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="stop-icon w-3 h-3" viewBox="0 0 12 12" fill="currentColor"><rect width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </footer>
  </div>

  <script>
    const WORKER_HTTP_URL = "https://hws.hanjungyeop33.workers.dev/"; 
    const WORKER_WS_URL = "wss://hws.hanjungyeop33.workers.dev/"; 

    let userAccessKey = localStorage.getItem("hls_access_key") || "";
    let chatHistory = []; 
    let isUserScrollingUp = false; 
    let currentRoomId = ""; 
    let maxInputLimit = 6000; 
    let userTier = "FREE";
    let activeSocket = null;
    let isGenerating = false;
    let currentInterruptedAssistantText = "";
    let currentInterruptedThoughtText = "";
    let lastActiveBubbleElements = null;

    // [신규] 프롬프트 복원 및 에러 감지 추적 상태
    let lastSubmittedPrompt = "";
    let isResponseCompletedSuccessfully = false;
    let userStoppedCurrentResponse = false;

    // 마크다운 렌더링 스케줄러 상태
    let renderRafId = null;
    let lastRenderTimestamp = 0;

    const userInput = document.getElementById('user-input');
    const charCounter = document.getElementById('char-counter');
    const chatContainer = document.getElementById('chat-container');
    const modelSelector = document.getElementById('model-selector');
    const modelDescription = document.getElementById('model-description');
    const roomListContainer = document.getElementById('room-list');
    const currentRoomTitle = document.getElementById('current-room-title');
    const continueBanner = document.getElementById('continue-banner');
    const sendBtn = document.getElementById('send-btn');

    function setGenerationState(generating) {
      isGenerating = generating;
      sendBtn.classList.toggle('generating', generating);
      userInput.disabled = generating;
      modelSelector.disabled = generating;
    }

    // [신규] 비정상 종료 시 원본 프롬프트 복원 함수
    function restorePromptToInput(errorMessage = "") {
      if (lastSubmittedPrompt && !isResponseCompletedSuccessfully && !userStoppedCurrentResponse) {
        userInput.value = lastSubmittedPrompt;
        updateCharCounter();
        userInput.focus();

        // 실패한 직전 사용자 메시지 히스토리 롤백
        if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
          chatHistory.pop();
        }
      }
      if (errorMessage) {
        showError(errorMessage);
      }
    }

    function toggleSidebar(open) {
      document.getElementById('sidebar').classList.toggle('-translate-x-full', !open);
    }

    function applyUserTierConfig(tier, maxLimit) {
      userTier = (tier || "FREE").toUpperCase();
      maxInputLimit = maxLimit || 6000;
      document.getElementById('user-tier-badge-pc').textContent = userTier;
      userInput.setAttribute("maxlength", maxInputLimit);
      updateCharCounter();
      updateModelDescription();
    }

    function updateModelDescription() {
      const selected = modelSelector.value;
      if (selected === "ultra") {
        modelDescription.textContent = "HLS PRO-ULTRA (Self-Correction & 1회 통합 검색 최적화)";
      } else if (selected === "pro") {
        modelDescription.textContent = "HLS PRO (고성능 추론 및 사고)";
      } else {
        modelDescription.textContent = "Light HLS (가볍고 빠른 응답)";
      }
    }

    function updateCharCounter() {
      charCounter.textContent = `${userInput.value.length.toLocaleString()} / ${maxInputLimit.toLocaleString()}`;
    }

    userInput.addEventListener('input', updateCharCounter);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chat-form').requestSubmit();
      }
    });

    function toggleThought(btn) {
      const thoughtDiv = btn.nextElementSibling;
      const span = btn.querySelector('span');
      const isHidden = thoughtDiv.classList.toggle('hidden');
      span.textContent = isHidden ? '▶ 추론 과정 보기' : '▼ 추론 과정 접기';
    }

    function createAssistantBubble() {
      const welcome = document.getElementById('welcome-message');
      if (welcome) welcome.style.display = 'none';
      const wrapper = document.createElement('div');
      wrapper.className = 'message-row flex w-full justify-start';
      
      wrapper.innerHTML = `
        <div class="assistant-card w-full relative">
          <div class="flex justify-between items-center mb-2">
            <div class="assistant-label">HLS</div>
            <div class="streaming-indicator flex items-center space-x-1.5 text-[11px] text-[#7c82ff]">
              <span class="status-dot"></span>
              <span>작성 중</span>
            </div>
          </div>
          <button onclick="toggleThought(this)" class="thought-toggle hidden">
            <span>▶ 추론 과정 보기</span>
          </button>
          <div class="thought-area hidden"></div>
          <div class="prose prose-invert text-sm break-words leading-relaxed max-w-none chat-content-area"></div>
        </div>
      `;
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      return {
        wrapper,
        contentArea: wrapper.querySelector('.chat-content-area'),
        thoughtArea: wrapper.querySelector('.thought-area'),
        toggleBtn: wrapper.querySelector('.thought-toggle'),
        indicator: wrapper.querySelector('.streaming-indicator')
      };
    }

    function appendUserMessage(text) {
      const welcome = document.getElementById('welcome-message');
      if (welcome) welcome.style.display = 'none';
      const wrapper = document.createElement('div');
      wrapper.className = 'message-row flex w-full justify-end';
      wrapper.innerHTML = `
        <div class="user-card text-sm leading-relaxed">${escapeHtml(text)}</div>
      `;
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showLoading() {
      removeLoading();
      const loader = document.createElement('div');
      loader.id = 'loading-bubble';
      loader.className = 'response-preparing';
      loader.innerHTML = `<span class="status-dot"></span><span>응답을 준비하고 있어요...</span>`;
      chatContainer.appendChild(loader);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeLoading() {
      const loader = document.getElementById('loading-bubble');
      if (loader) loader.remove();
    }

    function showError(message) {
      removeLoading();
      const errWrapper = document.createElement('div');
      errWrapper.className = 'flex w-full justify-center my-2';
      errWrapper.innerHTML = `
        <div class="bg-red-900/60 text-red-200 border border-red-800/80 text-xs px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-sm">
          <span>🚨 ${escapeHtml(message)}</span>
        </div>
      `;
      chatContainer.appendChild(errWrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
    }

    function injectCopyButtons(targetElement) {
      targetElement.querySelectorAll('pre').forEach((pre) => {
        if (pre.querySelector('.copy-btn')) return;
        const button = document.createElement('button');
        button.className = 'copy-btn';
        button.innerText = '복사';
        button.addEventListener('click', async () => {
          const codeText = pre.querySelector('code')?.innerText || '';
          await navigator.clipboard.writeText(codeText);
          button.innerText = '완료!';
          button.classList.add('copied');
          setTimeout(() => {
            button.innerText = '복사';
            button.classList.remove('copied');
          }, 2000);
        });
        pre.appendChild(button);
      });
    }

    function scheduleOptimizedRender(bubbleElements, assistantText, thoughtText) {
      const now = performance.now();
      if (now - lastRenderTimestamp < 60) {
        if (!renderRafId) {
          renderRafId = requestAnimationFrame(() => {
            renderRafId = null;
            lastRenderTimestamp = performance.now();
            performLightRender(bubbleElements, assistantText, thoughtText);
          });
        }
        return;
      }
      lastRenderTimestamp = now;
      performLightRender(bubbleElements, assistantText, thoughtText);
    }

    function performLightRender(bubbleElements, assistantText, thoughtText) {
      if (!bubbleElements) return;
      if (thoughtText) {
        bubbleElements.thoughtArea.innerText = `🤔 생각 중:\n${thoughtText}`;
      }
      if (assistantText && typeof marked !== 'undefined') {
        bubbleElements.contentArea.innerHTML = marked.parse(assistantText) + '<span class="streaming-cursor"></span>';
      }
      if (!isUserScrollingUp) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      if (isGenerating) {
        userStoppedCurrentResponse = true;
        if (activeSocket) activeSocket.close(1000, "user_stop");
        return;
      }
      const text = userInput.value.trim();
      if (!text) return;

      // [신규] 원본 텍스트 임시 보관 및 상태 초기화
      lastSubmittedPrompt = text;
      isResponseCompletedSuccessfully = false;
      userStoppedCurrentResponse = false;

      appendUserMessage(text);
      chatHistory.push({ role: 'user', content: text, timestamp: Date.now() });
      userInput.value = '';
      updateCharCounter();
      showLoading();

      currentInterruptedAssistantText = "";
      currentInterruptedThoughtText = "";
      setGenerationState(true);
      executeWebSocketStream(chatHistory);
    }

    function executeWebSocketStream(historyPayload, existingBubble = null) {
      let assistantText = currentInterruptedAssistantText || "";
      let thoughtText = currentInterruptedThoughtText || "";
      let bubbleElements = existingBubble;
      let buffer = "";
      let inThinkTag = false;

      const socketUrl = `${WORKER_WS_URL}?key=${encodeURIComponent(userAccessKey)}&roomId=${encodeURIComponent(currentRoomId || "default")}`;
      const socket = new WebSocket(socketUrl);
      activeSocket = socket;

      socket.onopen = () => {
        const selectedModel = modelSelector.value;
        socket.send(JSON.stringify({
          modelType: selectedModel === "light" ? "light" : "pro",
          useUltraMode: selectedModel === "ultra",
          messages: historyPayload,
        }));
      };

      socket.onmessage = (msgEvent) => {
        removeLoading();

        // Worker 내부 에러 JSON 처리
        try {
          const rawData = JSON.parse(msgEvent.data);
          if (rawData.error) {
            restorePromptToInput(rawData.error);
            socket.close();
            return;
          }
        } catch {}

        buffer += msgEvent.data;
        const lines = buffer.split("\n\n");
        buffer = lines.pop() || "";

        for (const block of lines) {
          const trimmed = block.trim();
          if (!trimmed.startsWith("data:")) continue;

          const jsonStr = trimmed.slice(5).trim();
          if (jsonStr === "[DONE]") {
            isResponseCompletedSuccessfully = true;
            if (bubbleElements) {
              if (thoughtText) bubbleElements.thoughtArea.innerText = `🤔 생각 중:\n${thoughtText}`;
              if (assistantText && typeof marked !== 'undefined') {
                bubbleElements.contentArea.innerHTML = marked.parse(assistantText);
                if (typeof Prism !== 'undefined') Prism.highlightAll();
                injectCopyButtons(bubbleElements.contentArea);
              }
              if (bubbleElements.indicator) bubbleElements.indicator.remove();
            }
            break;
          }

          try {
            const parsed = JSON.parse(jsonStr);
            const delta = parsed.choices?.[0]?.delta;
            if (!delta) continue;

            let deltaReasoning = delta.reasoning_content || delta.reasoning || "";
            let deltaContent = delta.content || "";

            if (deltaContent.includes("<think>")) {
              inThinkTag = true;
              deltaContent = deltaContent.replace("<think>", "");
            }
            if (inThinkTag) {
              if (deltaContent.includes("</think>")) {
                inThinkTag = false;
                const parts = deltaContent.split("</think>");
                deltaReasoning += parts[0];
                deltaContent = parts[1] || "";
              } else {
                deltaReasoning += deltaContent;
                deltaContent = "";
              }
            }

            if (deltaReasoning || deltaContent) {
              if (!bubbleElements) {
                bubbleElements = createAssistantBubble();
                lastActiveBubbleElements = bubbleElements;
              }

              if (deltaReasoning) {
                bubbleElements.toggleBtn.classList.remove('hidden');
                thoughtText += deltaReasoning;
                currentInterruptedThoughtText = thoughtText;
              }

              if (deltaContent) {
                assistantText += deltaContent;
                currentInterruptedAssistantText = assistantText;
              }

              scheduleOptimizedRender(bubbleElements, assistantText, thoughtText);
            }
          } catch {}
        }
      };

      socket.onclose = (event) => {
        removeLoading();
        setGenerationState(false);
        if (bubbleElements && bubbleElements.indicator) {
          bubbleElements.indicator.remove();
        }

        // [신규] 정상 완료가 아니고 내용이 전혀 출력되지 않은 비정상 종료 시 프롬프트 복원
        if (!isResponseCompletedSuccessfully && !userStoppedCurrentResponse && assistantText.trim().length === 0) {
          restorePromptToInput("응답 생성이 비정상적으로 종료되어 프롬프트를 복원했습니다.");
          if (bubbleElements && bubbleElements.wrapper) {
            bubbleElements.wrapper.remove();
          }
          return;
        }

        // 중간에 끊긴 경우 (이어받기 배너 활성화)
        if (!isResponseCompletedSuccessfully && !userStoppedCurrentResponse && assistantText.length > 5) {
          continueBanner.classList.remove('hidden');
        }

        if (bubbleElements && assistantText) {
          bubbleElements.contentArea.innerHTML = marked.parse(assistantText);
          if (typeof Prism !== 'undefined') Prism.highlightAll();
          injectCopyButtons(bubbleElements.contentArea);
          chatHistory.push({ role: 'assistant', content: assistantText, reasoning: thoughtText || undefined, timestamp: Date.now() });
          saveCurrentChatToKV();
        }
      };

      socket.onerror = () => {
        removeLoading();
        setGenerationState(false);
        if (bubbleElements && bubbleElements.indicator) {
          bubbleElements.indicator.remove();
        }
        // [신규] 통신 에러 발생 시 원래 프롬프트 복원
        restorePromptToInput("네트워크 통신 오류로 응답이 중단되어 작성 중이던 프롬프트를 복원했습니다.");
      };
    }

    async function saveCurrentChatToKV() {
      if (!currentRoomId || chatHistory.length === 0) return;
      try {
        await fetch(WORKER_HTTP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Key": userAccessKey },
          body: JSON.stringify({ action: "save_history", roomId: currentRoomId, history: chatHistory })
        });
      } catch {}
    }

    function startNewChat() {
      currentRoomId = 'room_' + Date.now();
      chatHistory = [];
      chatContainer.innerHTML = `
        <div id="welcome-message" class="text-center py-12 md:py-16 space-y-5">
          <div class="flex justify-center"><img src="https://github.com/FLY-H4N33/FLY-H4N-HLS/blob/main/HLS_ICON.png?raw=true" alt="HLS Logo" class="logo-style"></div>
          <h1 class="text-2xl md:text-3xl font-bold text-white">무엇을 도와드릴까요?</h1>
          <p class="text-gray-400 max-w-md mx-auto text-xs md:text-sm px-4">HLS 고성능 추론 인공지능</p>
        </div>
      `;
    }

    function switchAuthTab(tab) {
      document.getElementById('panelLogin').classList.toggle('hidden', tab !== 'login');
      document.getElementById('panelRegister').classList.toggle('hidden', tab !== 'register');
    }

    function toggleKeyVisibility() {
      const input = document.getElementById('accessKeyInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function submitAccessKey() {
      const key = document.getElementById('accessKeyInput').value.trim();
      if (!key) return;
      try {
        const response = await fetch(WORKER_HTTP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Key": key },
          body: JSON.stringify({ action: "validate" })
        });
        if (!response.ok) throw new Error("인증 실패");
        const data = await response.json();
        userAccessKey = key;
        localStorage.setItem("hls_access_key", key);
        document.getElementById('auth-overlay').classList.add('hidden');
        applyUserTierConfig(data.role, data.maxInputLimit);
        startNewChat();
      } catch (e) {
        alert("액세스 키가 올바르지 않습니다.");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (userAccessKey) {
        document.getElementById('accessKeyInput').value = userAccessKey;
        submitAccessKey();
      } else {
        updateModelDescription();
      }
    });
  </script>
</body>
